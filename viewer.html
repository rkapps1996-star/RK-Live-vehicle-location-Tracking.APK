<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RK Live Vehicle Tracking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f7f5;color:#153b35}.top{background:linear-gradient(120deg,#075e54,#168b65);color:#fff;padding:18px 16px}.top h2{margin:0 0 6px;font-size:20px}.top p{margin:0;font-size:13px;opacity:.9}.panel{margin:14px;padding:15px;background:#fff;border-radius:14px;box-shadow:0 3px 14px #1232}.status{font-weight:700}.muted{font-size:13px;color:#52645f;margin-top:6px}#map{height:62vh;min-height:340px;margin:14px;border-radius:14px;overflow:hidden;background:#dce9e4}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#16a36d;margin-right:7px}.stopped{background:#d97706}.error{color:#b42318}
</style></head><body>
<header class="top"><h2>RK LIVE VEHICLE TRACKING</h2><p>వాహనం యొక్క తాజా GPS లొకేషన్</p></header>
<section class="panel"><div class="status" id="vehicle">లొకేషన్ లోడ్ అవుతోంది…</div><div class="muted" id="state">దయచేసి వేచి ఉండండి</div><div class="muted" id="updated"></div></section>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUPABASE_URL='https://olucoxvhiatgxtymaolg.supabase.co';
const SUPABASE_KEY='sb_publishable_TY0c2hjU5vpCHLpfPAbKXg_piEil8Hs';
const shareId=new URLSearchParams(location.search).get('id');
const vehicleEl=document.getElementById('vehicle'),stateEl=document.getElementById('state'),updatedEl=document.getElementById('updated');
const map=L.map('map').setView([16.5,80.6],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let marker=null,first=true,stopped=false;
async function refresh(){
 if(!shareId){vehicleEl.textContent='తప్పు Live Tracking లింక్';stateEl.className='muted error';stateEl.textContent='లింక్‌లో ID లేదు.';return;}
 try{
  const url=SUPABASE_URL+'/rest/v1/live_locations?share_id=eq.'+encodeURIComponent(shareId)+'&select=share_id,vehicle,latitude,longitude,accuracy,updated_at,active&limit=1';
  const r=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(!r.ok)throw new Error('Server '+r.status);
  const rows=await r.json();if(!rows.length){vehicleEl.textContent='లొకేషన్ ఇంకా అందుబాటులో లేదు';stateEl.textContent='వాహనం GPS ప్రారంభించిన తర్వాత మ్యాప్ కనిపిస్తుంది.';return;}
  const d=rows[0],lat=Number(d.latitude),lon=Number(d.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
  vehicleEl.textContent=d.vehicle||'వాహనం';stopped=!d.active;
  stateEl.innerHTML='<span class="dot '+(stopped?'stopped':'')+'"></span>'+(stopped?'Tracking ఆపబడింది • చివరి లొకేషన్':'Live Tracking కొనసాగుతోంది');
  updatedEl.textContent='చివరి అప్‌డేట్: '+new Date(d.updated_at).toLocaleString('te-IN')+' • ఖచ్చితత్వం ±'+Math.round(d.accuracy||0)+' మీ.';
  const point=[lat,lon];if(!marker){marker=L.marker(point).addTo(map).bindPopup(d.vehicle||'వాహనం');}else marker.setLatLng(point);
  if(first){map.setView(point,16);first=false;}else map.panTo(point);
 }catch(e){stateEl.className='muted error';stateEl.textContent='లొకేషన్ పొందడంలో సమస్య. ఇంటర్నెట్ తనిఖీ చేయండి.';console.error(e);}
}
refresh();setInterval(refresh,5000);
</script></body></html>
