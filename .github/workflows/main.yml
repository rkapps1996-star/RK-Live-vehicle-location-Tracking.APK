
name: RK Vehicle Tracking APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project
        run: |
          ls -la
          test -d app
          test -f settings.gradle

      - name: Verify Web Assets
        run: |
          ls -la app/src/main/assets/
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/app.js
          test -f app/src/main/assets/styles.css

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK Assets
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          unzip -l "$APK" | grep -E 'assets/(index.html|app.js|styles.css)$'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RK-Vehicle-Tracking-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
